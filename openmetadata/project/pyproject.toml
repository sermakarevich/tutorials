[project]
name = "openmetadata-tutorial"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openmetadata-ingestion[postgres]==2.0.5.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "playwright>=1.63.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmetadata_tutorial"]

[tool.pytest.ini_options]
markers = ["stack: needs the running Docker stack (`just up`)"]
