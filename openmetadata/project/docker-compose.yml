# OpenMetadata tutorial stack.
# Derived from the official OpenMetadata 2.0.5 release file docker-compose-postgres.yml
# (https://github.com/open-metadata/OpenMetadata/releases/tag/2.0.5-release) with only these changes:
#   - container names prefixed om-tutorial-*, unusual host ports (see index.md), named volumes, no fixed subnet
#   - added `shopdb` (the Brightcup source database the tutorial catalogs) and `webhook` (alert receiver, chapter 09)
# Never edit from a chapter: every chapter relies on these names and ports.
name: om-tutorial
volumes:
  metadb-data: null
  search-data: null
  shopdb-data: null
  ingestion-volume-dag-airflow: null
  ingestion-volume-dags: null
  ingestion-volume-tmp: null
services:
  postgresql:
    container_name: om-tutorial-metadb
    image: docker.getcollate.io/openmetadata/postgresql:2.0.5
    restart: always
    command: --work_mem=10MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    expose:
    - 5432
    ports:
    - 15432:5432
    volumes:
    - metadb-data:/var/lib/postgresql/data
    healthcheck:
      test: psql -U postgres -tAc 'select 1' -d openmetadata_db
      interval: 15s
      timeout: 10s
      retries: 10
  elasticsearch:
    container_name: om-tutorial-search
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    environment:
    - discovery.type=single-node
    - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
    - xpack.security.enabled=false
    ports:
    - 19200:9200
    healthcheck:
      test: curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
    - search-data:/usr/share/elasticsearch/data
  execute-migrate-all:
    container_name: om-tutorial-migrate
    image: docker.getcollate.io/openmetadata/server:2.0.5
    command: ./bootstrap/openmetadata-ops.sh migrate
    environment:
      OPENMETADATA_CLUSTER_NAME: ${OPENMETADATA_CLUSTER_NAME:-openmetadata}
      SERVER_PORT: ${SERVER_PORT:-8585}
      SERVER_ADMIN_PORT: ${SERVER_ADMIN_PORT:-8586}
